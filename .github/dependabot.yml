# Dependabot: tự quét lỗ hổng + cập nhật dependency, mở PR để review.
# https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Thư viện npm (Next, Prisma, zod, bcryptjs...)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    # Gộp các bản vá nhỏ vào 1 PR để đỡ nhiễu; bản major tách riêng để review kỹ.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Chính các GitHub Actions dùng trong workflow (nếu có) cũng cần cập nhật.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
