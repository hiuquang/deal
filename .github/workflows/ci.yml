name: CI

# Chạy trên mọi push vào main và mọi PR (gồm cả PR do Dependabot mở) → không
# bản cập nhật dependency nào merge được nếu làm hỏng typecheck hoặc test.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # DATABASE_URL giả: prisma generate + import client cần biến tồn tại, nhưng
    # test mock toàn bộ prisma nên KHÔNG kết nối DB thật. Không có secret DB ở CI.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
